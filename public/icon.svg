<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021c19" />
      <stop offset="100%" stop-color="#003732" />
    </linearGradient>
    <linearGradient id="pillTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="100%" stop-color="#00c9ae" />
    </linearGradient>
    <linearGradient id="pillBottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect x="24" y="24" width="464" height="464" rx="120" fill="url(#bgGrad)" stroke="#26f5d8" stroke-width="8" />

  <!-- Pill Group -->
  <g transform="rotate(-35 256 256)">
    <!-- Bottom Half -->
    <path d="M188 256 H324 V330 C324 368 293 398 256 398 C219 398 188 368 188 330 Z" fill="url(#pillBottom)" />
    <!-- Top Half -->
    <path d="M188 182 C188 144 219 114 256 114 C293 114 324 144 324 182 V256 H188 Z" fill="url(#pillTop)" />
    <!-- Center Divider -->
    <rect x="186" y="247" width="140" height="18" fill="#ffffff" opacity="0.9" rx="4" />
  </g>

  <!-- Heartbeat ECG Wave Line with Glow -->
  <path d="M70 270 H150 L180 230 L210 320 L250 160 L295 350 L335 220 L365 270 H440" 
        stroke="#38bdf8" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)" />
  <path d="M70 270 H150 L180 230 L210 320 L250 160 L295 350 L335 220 L365 270 H440" 
        stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Pulse Active Beacon -->
  <circle cx="440" cy="270" r="16" fill="#2dd4bf" />
  <circle cx="440" cy="270" r="26" fill="#2dd4bf" opacity="0.4" />
</svg>
